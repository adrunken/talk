<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, iframe { width: 100%; height: 100%; display: block; }
        body { overflow: hidden; }
    </style>
</head>
<body>
    <iframe id="game" style="width:100%;height:100%;border:none;"></iframe>
    <script>
        var url = new URLSearchParams(window.location.search).get('url');
        if (url) {
            document.getElementById('game').src = decodeURIComponent(url);
        }
    </script>
</body>
</html>
