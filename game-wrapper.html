<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body, iframe {
            width: 100%;
            height: 100%;
            display: block;
        }
        body {
            overflow: hidden;
        }
    </style>
</head>
<body>
    <iframe id="game-frame" frameborder="0"></iframe>

    <script>
        const gameUrl = new URLSearchParams(window.location.search).get('url');
        const gameFrame = document.getElementById('game-frame');

        if (gameUrl) {
            gameFrame.src = gameUrl;
        }

        // Handle messages from the game iframe requesting storage operations
        window.addEventListener('message', (event) => {
            if (event.source !== gameFrame.contentWindow) {
                return;
            }

            const message = event.data;
            if (message && message.type === 'storage-op') {
                const { action, key, value, requestId } = message;
                let result = null;
                let error = null;

                try {
                    if (action === 'getItem') {
                        result = localStorage.getItem(key);
                    } else if (action === 'setItem') {
                        localStorage.setItem(key, value);
                    } else if (action === 'removeItem') {
                        localStorage.removeItem(key);
                    } else if (action === 'clear') {
                        localStorage.clear();
                    } else if (action === 'key') {
                        result = localStorage.key(parseInt(key, 10));
                    } else if (action === 'length') {
                        result = localStorage.length;
                    }
                } catch (e) {
                    error = e.message;
                }

                gameFrame.contentWindow.postMessage(
                    {
                        type: 'storage-result',
                        requestId,
                        result,
                        error
                    },
                    '*'
                );
            }
        });

        gameFrame.addEventListener('load', () => {
            try {
                const storageShim = `
(function() {
    let requestId = 0;
    const pendingRequests = new Map();

    const createStorageProxy = () => {
        return new Proxy({}, {
            get(target, prop) {
                if (prop === 'getItem') {
                    return (key) => {
                        const id = ++requestId;
                        let result = null;
                        let gotResponse = false;

                        const handler = (e) => {
                            if (e.data && e.data.type === 'storage-result' && e.data.requestId === id) {
                                result = e.data.result;
                                gotResponse = true;
                                window.removeEventListener('message', handler);
                            }
                        };

                        window.addEventListener('message', handler);
                        window.parent.postMessage({ type: 'storage-op', action: 'getItem', key, requestId: id }, '*');

                        // Wait for response with timeout
                        const start = Date.now();
                        while (!gotResponse && Date.now() - start < 50) {
                            // Wait
                        }

                        if (!gotResponse) {
                            window.removeEventListener('message', handler);
                        }
                        return result;
                    };
                }
                if (prop === 'setItem') {
                    return (key, value) => {
                        window.parent.postMessage({ type: 'storage-op', action: 'setItem', key, value, requestId: ++requestId }, '*');
                    };
                }
                if (prop === 'removeItem') {
                    return (key) => {
                        window.parent.postMessage({ type: 'storage-op', action: 'removeItem', key, requestId: ++requestId }, '*');
                    };
                }
                if (prop === 'clear') {
                    return () => {
                        window.parent.postMessage({ type: 'storage-op', action: 'clear', requestId: ++requestId }, '*');
                    };
                }
                if (prop === 'key') {
                    return (index) => {
                        const id = ++requestId;
                        let result = null;
                        let gotResponse = false;

                        const handler = (e) => {
                            if (e.data && e.data.type === 'storage-result' && e.data.requestId === id) {
                                result = e.data.result;
                                gotResponse = true;
                                window.removeEventListener('message', handler);
                            }
                        };

                        window.addEventListener('message', handler);
                        window.parent.postMessage({ type: 'storage-op', action: 'key', key: index, requestId: id }, '*');

                        const start = Date.now();
                        while (!gotResponse && Date.now() - start < 50) {
                            // Wait
                        }

                        if (!gotResponse) {
                            window.removeEventListener('message', handler);
                        }
                        return result;
                    };
                }
                if (prop === 'length') {
                    const id = ++requestId;
                    let result = 0;
                    let gotResponse = false;

                    const handler = (e) => {
                        if (e.data && e.data.type === 'storage-result' && e.data.requestId === id) {
                            result = e.data.result;
                            gotResponse = true;
                            window.removeEventListener('message', handler);
                        }
                    };

                    window.addEventListener('message', handler);
                    window.parent.postMessage({ type: 'storage-op', action: 'length', requestId: id }, '*');

                    const start = Date.now();
                    while (!gotResponse && Date.now() - start < 50) {
                        // Wait
                    }

                    if (!gotResponse) {
                        window.removeEventListener('message', handler);
                    }
                    return result;
                }
                return undefined;
            },
            set(target, prop, value) {
                try {
                    target[prop] = value;
                } catch (e) {
                    // Ignore
                }
                return true;
            },
            has(target, prop) {
                return prop in ['getItem', 'setItem', 'removeItem', 'clear', 'key', 'length'];
            }
        });
    };

    try {
        Object.defineProperty(window, 'localStorage', {
            value: createStorageProxy(),
            writable: false,
            configurable: true
        });
    } catch (e) {
        console.warn('Could not override localStorage');
    }
})();
                `;

                const script = gameFrame.contentDocument.createElement('script');
                script.textContent = storageShim;
                gameFrame.contentDocument.head.insertBefore(script, gameFrame.contentDocument.head.firstChild);
            } catch (e) {
                console.warn('Could not inject storage shim:', e);
            }
        });
    </script>
</body>
</html>
